services:
  - type: web
    name: devops-pipeline-puzzle
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MEMORY_STORE
        value: "true"
      - key: LEADERBOARD_ENABLED
        value: "true"
